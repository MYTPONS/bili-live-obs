[project]
name = "bls"
version = "0.1.0"
description = "B 站一键开播 + OBS 自动填推流码"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "qrcode>=7.4",
    "pillow>=10.0",
    "websocket-client>=1.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
bls = "bls.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bls"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
